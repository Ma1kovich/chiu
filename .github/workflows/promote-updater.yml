name: Promote updater metadata

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix (for example, 0.1.0)
        required: true
        type: string

concurrency:
  group: updater-metadata
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      metadata_sha256: ${{ steps.stage.outputs.metadata_sha256 }}
      metadata_url: ${{ steps.pages.outputs.base_url }}/latest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install the updater signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign
      - name: Verify public updater artifacts and prepare metadata
        id: stage
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METADATA_URL: ${{ steps.pages.outputs.base_url }}/latest.json
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
          bash .github/scripts/validate-release-policy.sh "$VERSION" "$METADATA_URL"
          tag="v$VERSION"
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false
          release=$(gh release view "$tag" --json isPrerelease,publishedAt)
          release_is_prerelease=$(jq -r .isPrerelease <<<"$release")
          release_published_at=$(jq -er .publishedAt <<<"$release")
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" --jq .immutable)" = true
          release_version="${VERSION%%+*}"
          if [[ "$release_version" == *-* ]]; then
            test "$release_is_prerelease" = true
          else
            test "$release_is_prerelease" = false
          fi

          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          release_assets=$(gh release view "$tag" --json assets --jq '.assets[].name')

          release_asset() {
            local canonical="$1"
            local legacy="$2"
            local match
            match=$(printf '%s\n' "$release_assets" | grep -Fxe "$canonical" -e "$legacy")
            test "$(printf '%s\n' "$match" | wc -l | tr -d ' ')" -eq 1
            printf '%s\n' "$match"
          }

          windows=$(release_asset chiu-setup.exe "chiu_${VERSION}_windows_x64_unsigned-setup.exe")
          disk_image=$(release_asset chiu.dmg "chiu_${VERSION}_darwin_universal_adhoc.dmg")
          macos=$(release_asset chiu-updater-macos.tar.gz "chiu_${VERSION}_darwin_universal_adhoc.app.tar.gz")
          windows_signature="$windows.sig"
          macos_signature="$macos.sig"
          checksums='SHA256SUMS.txt'

          fetch_asset() {
            local url="$1"
            local name="$2"
            curl --fail --location --retry 6 --retry-all-errors --retry-delay 5 \
              --output "$RUNNER_TEMP/$name" "$url/$name"
          }

          fetch_asset "$base_url" "$windows"
          fetch_asset "$base_url" "$windows_signature"
          fetch_asset "$base_url" "$disk_image"
          fetch_asset "$base_url" "$macos"
          fetch_asset "$base_url" "$macos_signature"
          fetch_asset "$base_url" "$checksums"
          test -s "$RUNNER_TEMP/$windows"
          test -s "$RUNNER_TEMP/$windows_signature"
          test -s "$RUNNER_TEMP/$disk_image"
          test -s "$RUNNER_TEMP/$macos"
          test -s "$RUNNER_TEMP/$macos_signature"
          test -s "$RUNNER_TEMP/$checksums"
          (
            cd "$RUNNER_TEMP"
            sha256sum --check "$checksums"
          )
          key_file=$(git show "$tag:src-tauri/tauri.conf.json" | jq -er '.plugins.updater.pubkey' | base64 --decode)
          comment="${key_file%%$'\n'*}"
          public_key="${key_file#*$'\n'}"
          test "$comment" != "$key_file"
          [[ "$comment" == 'untrusted comment: minisign public key: '* ]]
          [[ "$public_key" == RW* ]]
          [[ "$public_key" != *$'\n'* ]]
          windows_verification_signature=$(mktemp)
          macos_verification_signature=$(mktemp)
          trap 'rm -f "$windows_verification_signature" "$macos_verification_signature"' EXIT
          base64 --decode "$RUNNER_TEMP/$windows_signature" > "$windows_verification_signature"
          base64 --decode "$RUNNER_TEMP/$macos_signature" > "$macos_verification_signature"
          minisign -Vm "$RUNNER_TEMP/$windows" -x "$windows_verification_signature" -P "$public_key"
          minisign -Vm "$RUNNER_TEMP/$macos" -x "$macos_verification_signature" -P "$public_key"

          site_directory="$RUNNER_TEMP/chiu-pages"
          mkdir "$site_directory"
          touch "$site_directory/.nojekyll"
          metadata="$site_directory/latest.json"
          jq -n \
            --arg version "$VERSION" \
            --arg published_at "$release_published_at" \
            --arg windows_url "$base_url/$windows" \
            --arg macos_url "$base_url/$macos" \
            --rawfile windows_signature "$RUNNER_TEMP/$windows_signature" \
            --rawfile macos_signature "$RUNNER_TEMP/$macos_signature" \
            '{
              version: $version,
              pub_date: $published_at,
              platforms: {
                "windows-x86_64": {
                  url: $windows_url,
                  signature: $windows_signature
                },
                "darwin-aarch64": {
                  url: $macos_url,
                  signature: $macos_signature
                },
                "darwin-x86_64": {
                  url: $macos_url,
                  signature: $macos_signature
                }
              }
            }' > "$metadata"

          jq -e \
            --arg version "$VERSION" \
            --arg windows_url "$base_url/$windows" \
            --arg macos_url "$base_url/$macos" \
            --rawfile windows_signature "$RUNNER_TEMP/$windows_signature" \
            --rawfile macos_signature "$RUNNER_TEMP/$macos_signature" \
            '.version == $version
              and (.platforms | keys == ["darwin-aarch64", "darwin-x86_64", "windows-x86_64"])
              and .platforms["windows-x86_64"] == {url: $windows_url, signature: $windows_signature}
              and .platforms["darwin-aarch64"] == {url: $macos_url, signature: $macos_signature}
              and .platforms["darwin-x86_64"] == {url: $macos_url, signature: $macos_signature}' \
            "$metadata"

          current_metadata="$RUNNER_TEMP/current-latest.json"
          current_status=$(curl --silent --show-error --location \
            --output "$current_metadata" --write-out '%{http_code}' "$METADATA_URL")
          if [[ "$current_status" == 200 ]]; then
            current_version=$(jq -er .version "$current_metadata")
            python3 - "$current_version" "$VERSION" <<'PY'
          import re
          import sys

          semver = re.compile(
              r"^v?(?P<core>\d+\.\d+\.\d+)(?:-(?P<pre>[0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$"
          )

          def parse(version):
              match = semver.fullmatch(version)
              if match is None:
                  raise SystemExit(f"metadata has an invalid version: {version}")
              return tuple(map(int, match["core"].split("."))), match["pre"]

          def compare_prerelease(left, right):
              if left is None:
                  return 0 if right is None else 1
              if right is None:
                  return -1
              for left_identifier, right_identifier in zip(left.split("."), right.split(".")):
                  if left_identifier == right_identifier:
                      continue
                  left_numeric = left_identifier.isdecimal()
                  right_numeric = right_identifier.isdecimal()
                  if left_numeric and right_numeric:
                      return (int(left_identifier) > int(right_identifier)) - (int(left_identifier) < int(right_identifier))
                  if left_numeric:
                      return -1
                  if right_numeric:
                      return 1
                  return (left_identifier > right_identifier) - (left_identifier < right_identifier)
              return (len(left.split(".")) > len(right.split("."))) - (len(left.split(".")) < len(right.split(".")))

          current_core, current_pre = parse(sys.argv[1])
          requested_core, requested_pre = parse(sys.argv[2])
          comparison = (current_core > requested_core) - (current_core < requested_core)
          if comparison == 0:
              comparison = compare_prerelease(current_pre, requested_pre)
          if comparison > 0:
              raise SystemExit("refusing to replace updater metadata with an older version")
          if comparison == 0 and sys.argv[1] != sys.argv[2]:
              raise SystemExit("refusing to replace updater metadata with a version of equal precedence")
          PY
            if [[ "$current_version" == "$VERSION" ]]; then
              cmp --silent "$current_metadata" "$metadata"
            fi
          else
            test "$current_status" = 404
          fi

          metadata_sha256=$(sha256sum "$metadata" | cut -d ' ' -f 1)
          echo "metadata_sha256=$metadata_sha256" >> "$GITHUB_OUTPUT"
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/chiu-pages

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify the served updater metadata
        env:
          EXPECTED_SHA256: ${{ needs.prepare.outputs.metadata_sha256 }}
          METADATA_URL: ${{ needs.prepare.outputs.metadata_url }}
        run: |
          served="$RUNNER_TEMP/served-latest.json"
          for _ in {1..12}; do
            if curl --fail --silent --show-error --location --output "$served" "$METADATA_URL"; then
              actual_sha256=$(sha256sum "$served" | cut -d ' ' -f 1)
              if [[ "$actual_sha256" == "$EXPECTED_SHA256" ]]; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
