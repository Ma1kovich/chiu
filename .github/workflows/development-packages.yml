name: Development packages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/development-packages.yml
      - rust-toolchain.toml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/build.rs
      - src-tauri/tauri.conf.json
      - src-tauri/icons/**

permissions:
  contents: read

env:
  TAURI_CLI_VERSION: 2.11.4

jobs:
  windows-package:
    name: Windows x64 unsigned development package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm pinned toolchain
        run: rustup show active-toolchain
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version $env:TAURI_CLI_VERSION --locked
      - name: Build unsigned NSIS installer
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis --ci --no-sign -- --locked
      - name: Validate and stage installer
        id: stage
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }

          $header = [System.IO.File]::ReadAllBytes($installers[0].FullName)
          if ($header.Length -lt 0x40 -or $header[0] -ne 0x4d -or $header[1] -ne 0x5a) {
            throw "NSIS output does not have a valid DOS header."
          }

          $peOffset = [BitConverter]::ToUInt32($header, 0x3c)
          if ($peOffset -gt ($header.Length - 4)) {
            throw "NSIS output has a PE header offset outside the file."
          }

          if (
            $header[$peOffset] -ne 0x50 -or
            $header[$peOffset + 1] -ne 0x45 -or
            $header[$peOffset + 2] -ne 0x00 -or
            $header[$peOffset + 3] -ne 0x00
          ) {
            throw "NSIS output does not have a valid PE signature."
          }

          $signature = Get-AuthenticodeSignature -FilePath $installers[0].FullName
          if ($signature.Status -ne "NotSigned") {
            throw "Expected an unsigned development installer, got signature status $($signature.Status)."
          }

          $artifactName = "chiu-development-validation-unsigned-windows-x64-nsis-${{ github.run_id }}-${{ github.run_attempt }}.exe"
          $artifactPath = Join-Path $env:RUNNER_TEMP $artifactName
          Copy-Item -Path $installers[0].FullName -Destination $artifactPath
          $sha256 = (Get-FileHash -Path $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()

          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_path=$artifactPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload installer
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.stage.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Record package evidence
        shell: pwsh
        run: |
          @(
            "## Windows development package"
            ""
            "- Source SHA: ${{ github.sha }}"
            "- Run: ${{ github.run_id }}, attempt ${{ github.run_attempt }}"
            "- Runner: Windows x64"
            "- Tauri CLI: $env:TAURI_CLI_VERSION"
            "- Build command: cargo tauri build --bundles nsis --ci --no-sign -- --locked"
            "- Artifact: [${{ steps.stage.outputs.artifact_name }}](${{ steps.upload.outputs.artifact-url }})"
            "- SHA-256: ${{ steps.stage.outputs.sha256 }}"
            "- Retention: 30 days"
            ""
            "> Unsigned, non-release development-validation artifact. CI does not prove installation, launch, tray behavior, single-instance behavior, or clean exit on a real machine."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  macos-package:
    name: macOS universal unsigned development package
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm pinned toolchain
        run: rustup show active-toolchain
      - name: Install macOS compilation targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
      - name: Build unsigned application bundle
        working-directory: src-tauri
        run: cargo tauri build --target universal-apple-darwin --bundles app --ci --no-sign -- --locked
      - name: Validate and stage application bundle
        id: stage
        shell: bash
        run: |
          set -euo pipefail

          assert_universal_architectures() {
            local executable_path="$1"
            local architectures
            architectures=$(lipo -archs "$executable_path" | tr ' ' '\n' | LC_ALL=C sort | paste -sd ' ' -)
            test "$architectures" = "arm64 x86_64"
          }

          bundle="src-tauri/target/universal-apple-darwin/release/bundle/macos/Chiù.app"
          info_plist="$bundle/Contents/Info.plist"
          executable="$bundle/Contents/MacOS/chiu"
          test -f "$info_plist"
          test -x "$executable"
          assert_universal_architectures "$executable"

          bundle_identifier=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$info_plist")
          test "$bundle_identifier" = "io.github.ma1kovich.chiu"

          artifact_name="chiu-development-validation-unsigned-macos-universal-app-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz"
          artifact_path="$RUNNER_TEMP/$artifact_name"
          tar -czf "$artifact_path" -C "$(dirname "$bundle")" "$(basename "$bundle")"

          tar -tzf "$artifact_path" | grep -F "/Contents/Info.plist"
          tar -tzf "$artifact_path" | grep -F "/Contents/MacOS/chiu"
          validation_directory=$(mktemp -d "$RUNNER_TEMP/chiu-package-validation.XXXXXX")
          tar -xzf "$artifact_path" -C "$validation_directory"
          extracted_executable=$(find "$validation_directory" -type f -path "*/Contents/MacOS/chiu" -print)
          test -n "$extracted_executable"
          test -x "$extracted_executable"
          assert_universal_architectures "$extracted_executable"

          sha256=$(shasum -a 256 "$artifact_path" | awk '{print $1}')
          {
            echo "artifact_name=$artifact_name"
            echo "artifact_path=$artifact_path"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"
      - name: Upload application bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.stage.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Record package evidence
        shell: bash
        run: |
          {
            echo "## macOS development package"
            echo
            echo "- Source SHA: ${{ github.sha }}"
            echo "- Run: ${{ github.run_id }}, attempt ${{ github.run_attempt }}"
            echo "- Runner architecture: macOS arm64"
            echo "- Package architectures: arm64, x86_64"
            echo "- Tauri CLI: $TAURI_CLI_VERSION"
            echo "- Build command: cargo tauri build --target universal-apple-darwin --bundles app --ci --no-sign -- --locked"
            echo "- Artifact: [${{ steps.stage.outputs.artifact_name }}](${{ steps.upload.outputs.artifact-url }})"
            echo "- SHA-256: ${{ steps.stage.outputs.sha256 }}"
            echo "- Retention: 30 days"
            echo
            echo "> Unsigned and unnotarized, non-release development-validation artifact. CI does not prove installation, launch, menu-bar behavior, single-instance behavior, or clean exit on a real machine."
          } >> "$GITHUB_STEP_SUMMARY"
