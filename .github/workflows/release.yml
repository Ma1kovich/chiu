name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the v prefix (for example, 0.1.0-alpha.1)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Prepare the version commit and tag
        id: prepare
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]

          tag="v$VERSION"
          current=$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "chiu") | .version')
          if git rev-parse --verify --quiet "refs/tags/$tag"; then
            git checkout --detach "$tag"
            tagged=$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "chiu") | .version')
            test "$tagged" = "$VERSION"
            {
              echo "sha=$(git rev-parse HEAD)"
              echo "tag=$tag"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$current" != "$VERSION"

          perl -0pi -e 's/^version = "[^"]+"$/version = "$ENV{VERSION}"/m' src-tauri/Cargo.toml
          cargo update --manifest-path src-tauri/Cargo.toml -p chiu
          resolved=$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "chiu") | .version')
          test "$resolved" = "$VERSION"

          test "$(git diff --name-only | sort)" = $'src-tauri/Cargo.lock\nsrc-tauri/Cargo.toml'
          git diff --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): v$VERSION"
          git tag "$tag"

          {
            echo "sha=$(git rev-parse HEAD)"
            echo "tag=$tag"
            echo "push=true"
          } >> "$GITHUB_OUTPUT"
      - name: Push the version commit and tag
        if: steps.prepare.outputs.push == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --atomic origin HEAD:"$DEFAULT_BRANCH" "v$VERSION"

  release:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2025
            args: --bundles nsis --ci -- --locked
          - platform: macos-26
            args: --target universal-apple-darwin --bundles app --ci -- --locked
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.5.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}
      - name: Verify the macOS application signature and architectures
        if: runner.os == 'macOS'
        run: |
          application='src-tauri/target/universal-apple-darwin/release/bundle/macos/Chiù.app'
          executable="$application/Contents/MacOS/chiu"
          test -d "$application"
          test -f "$executable"
          codesign --verify --deep --strict --verbose=2 "$application"
          codesign --display --verbose=4 "$application" 2>&1 | grep -Fqx 'Signature=adhoc'
          lipo "$executable" -verify_arch arm64 x86_64
          lipo -archs "$executable"
      - name: Stage the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          installers=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          test "${#installers[@]}" -eq 1
          test -f "${installers[0]}.sig"
          cp "${installers[0]}" "$RUNNER_TEMP/chiu_${VERSION}_windows_x64_unsigned-setup.exe"
          cp "${installers[0]}.sig" "$RUNNER_TEMP/chiu_${VERSION}_windows_x64_unsigned-setup.exe.sig"
      - name: Upload the staged Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-installer
          path: |
            ${{ runner.temp }}/chiu_${{ inputs.version }}_windows_x64_unsigned-setup.exe
            ${{ runner.temp }}/chiu_${{ inputs.version }}_windows_x64_unsigned-setup.exe.sig
          if-no-files-found: error
          retention-days: 1
      - name: Create and validate the macOS disk image
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          application='src-tauri/target/universal-apple-darwin/release/bundle/macos/Chiù.app'
          test -d "$application"

          staging_directory=$(mktemp -d "$RUNNER_TEMP/chiu-disk-image.XXXXXX")
          disk_image_root="$staging_directory/Chiù"
          mkdir "$disk_image_root"
          ditto "$application" "$disk_image_root/Chiù.app"
          ln -s /Applications "$disk_image_root/Applications"

          artifact_path="$RUNNER_TEMP/chiu_${VERSION}_darwin_universal_adhoc.dmg"
          hdiutil create -fs HFS+ -volname 'Chiù' -srcfolder "$disk_image_root" -format UDZO -ov "$artifact_path"
          hdiutil verify "$artifact_path"

          mount_directory=$(mktemp -d "$RUNNER_TEMP/chiu-release-mount.XXXXXX")
          detach_disk_image() {
            hdiutil detach "$mount_directory" -quiet || true
            rmdir "$mount_directory" || true
          }
          trap detach_disk_image EXIT

          hdiutil attach "$artifact_path" -nobrowse -readonly -mountpoint "$mount_directory"
          mounted_application="$mount_directory/Chiù.app"
          mounted_executable="$mounted_application/Contents/MacOS/chiu"
          test -d "$mounted_application"
          test -L "$mount_directory/Applications"
          test "$(readlink "$mount_directory/Applications")" = /Applications
          test -f "$mounted_executable"
          codesign --verify --deep --strict --verbose=2 "$mounted_application"
          codesign --display --verbose=4 "$mounted_application" 2>&1 | grep -Fqx 'Signature=adhoc'
          lipo "$mounted_executable" -verify_arch arm64 x86_64

          updater_archive='src-tauri/target/universal-apple-darwin/release/bundle/macos/Chiù.app.tar.gz'
          test -f "$updater_archive"
          test -f "$updater_archive.sig"
          updater_directory=$(mktemp -d "$RUNNER_TEMP/chiu-updater-archive.XXXXXX")
          tar -xzf "$updater_archive" -C "$updater_directory"
          updater_application="$updater_directory/Chiù.app"
          updater_executable="$updater_application/Contents/MacOS/chiu"
          test -f "$updater_executable"
          codesign --verify --deep --strict --verbose=2 "$updater_application"
          codesign --display --verbose=4 "$updater_application" 2>&1 | grep -Fqx 'Signature=adhoc'
          lipo "$updater_executable" -verify_arch arm64 x86_64
          cp "$updater_archive" "$RUNNER_TEMP/chiu_${VERSION}_darwin_universal_adhoc.app.tar.gz"
          cp "$updater_archive.sig" "$RUNNER_TEMP/chiu_${VERSION}_darwin_universal_adhoc.app.tar.gz.sig"
      - name: Upload the validated macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-disk-image
          path: ${{ runner.temp }}/chiu_${{ inputs.version }}_darwin_universal_adhoc.dmg
          if-no-files-found: error
          retention-days: 1
      - name: Upload the validated macOS updater payload
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-updater
          path: |
            ${{ runner.temp }}/chiu_${{ inputs.version }}_darwin_universal_adhoc.app.tar.gz
            ${{ runner.temp }}/chiu_${{ inputs.version }}_darwin_universal_adhoc.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 1

  checksums:
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Install the updater signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes minisign
      - name: Publish release artifacts and SHA-256 checksums
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          windows=(assets/*_windows_x64_unsigned-setup.exe)
          windows_signatures=(assets/*_windows_x64_unsigned-setup.exe.sig)
          macos=(assets/*_darwin_universal_adhoc.dmg)
          macos_updater=(assets/*_darwin_universal_adhoc.app.tar.gz)
          macos_updater_signatures=(assets/*_darwin_universal_adhoc.app.tar.gz.sig)
          test "${#windows[@]}" -eq 1
          test "${#windows_signatures[@]}" -eq 1
          test "${#macos[@]}" -eq 1
          test "${#macos_updater[@]}" -eq 1
          test "${#macos_updater_signatures[@]}" -eq 1
          key_file=$(jq -er '.plugins.updater.pubkey' src-tauri/tauri.conf.json | base64 --decode)
          comment="${key_file%%$'\n'*}"
          public_key="${key_file#*$'\n'}"
          test "$comment" != "$key_file"
          [[ "$comment" == 'untrusted comment: minisign public key: '* ]]
          [[ "$public_key" == RW* ]]
          [[ "$public_key" != *$'\n'* ]]
          windows_signature=$(mktemp)
          macos_updater_signature=$(mktemp)
          trap 'rm -f "$windows_signature" "$macos_updater_signature"' EXIT
          base64 --decode "${windows_signatures[0]}" > "$windows_signature"
          base64 --decode "${macos_updater_signatures[0]}" > "$macos_updater_signature"
          minisign -Vm "${windows[0]}" -x "$windows_signature" -P "$public_key"
          minisign -Vm "${macos_updater[0]}" -x "$macos_updater_signature" -P "$public_key"
          sha256sum "${windows[0]}" "${windows_signatures[0]}" "${macos[0]}" "${macos_updater[0]}" "${macos_updater_signatures[0]}" | sed 's#assets/##' | LC_ALL=C sort > assets/SHA256SUMS.txt

          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          else
            arguments=(
              --title "Chiù $TAG"
              --draft
              --generate-notes
              --notes "The application in the macOS disk image is ad-hoc signed. It is not signed with an Apple Developer ID and is not notarized. Mount the disk image and drag Chiù.app to Applications. macOS may require approval in System Settings → Privacy & Security → Open Anyway."
            )
            release_version="${VERSION%%+*}"
            if [[ "$release_version" == *-* ]]; then
              arguments+=(--prerelease)
            fi
            gh release create "$TAG" "${arguments[@]}"
          fi

          gh release delete-asset "$TAG" SHA256SUMS.txt --yes || true
          gh release upload "$TAG" "${windows[0]}" --clobber
          gh release upload "$TAG" "${windows_signatures[0]}" --clobber
          gh release upload "$TAG" "${macos[0]}" --clobber
          gh release upload "$TAG" "${macos_updater[0]}" --clobber
          gh release upload "$TAG" "${macos_updater_signatures[0]}" --clobber
          gh release upload "$TAG" assets/SHA256SUMS.txt --clobber
